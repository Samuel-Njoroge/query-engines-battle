# Run via:
#   docker compose --profile pinot exec pinot-controller \
#     bin/pinot-admin.sh LaunchDataIngestionJob -jobSpecFile /opt/pinot/ingestion/fact_events.job.yaml
# Replace ${SCALE} with the generated dataset's scale tier before running.
jobType: SegmentCreationAndTarPush
inputDirURI: 's3://benchmark-data/${SCALE}/fact_events/'
includeFileNamePattern: 'glob:**/*.parquet'
outputDirURI: '/tmp/pinot/segments/fact_events'
overwriteOutput: true
pinotFSSpecs:
  - scheme: s3
    className: org.apache.pinot.plugin.filesystem.S3PinotFS
    configs:
      region: 'us-east-1'
      accessKey: 'minioadmin'
      secretKey: 'minioadmin'
      endpoint: 'http://minio:9000'
  - scheme: file
    className: org.apache.pinot.spi.filesystem.LocalPinotFS
recordReaderSpec:
  dataFormat: 'parquet'
  className: 'org.apache.pinot.plugin.inputformat.parquet.ParquetRecordReader'
tableSpec:
  tableName: 'fact_events'
  schemaURI: 'http://pinot-controller:9000/tables/fact_events/schema'
  tableConfigURI: 'http://pinot-controller:9000/tables/fact_events'
pinotClusterSpecs:
  - controllerURI: 'http://pinot-controller:9000'
