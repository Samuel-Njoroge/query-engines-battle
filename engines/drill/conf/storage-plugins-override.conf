// Overrides Drill's default `dfs` storage plugin to point at the Garage
// (S3-compatible) bucket holding the generated dataset - see docker-compose.yml's
// `garage` service. Fixed dev-only credentials (see infra/garage/entrypoint.sh).

drill.exec.storage.plugins: {
  dfs: {
    type: "file",
    connection: "s3a://benchmark-data",
    config: {
      "fs.s3a.endpoint": "garage:3900",
      "fs.s3a.access.key": "GK86b64fdb0310ad7397228be5",
      "fs.s3a.secret.key": "4d1395f9529c8e8b9a7f61d1d31bf46714e30fa1a03ee1600c5b1ba599c131b2",
      "fs.s3a.path.style.access": "true",
      "fs.s3a.connection.ssl.enabled": "false"
    },
    workspaces: {
      root: {
        location: "/",
        writable: false
      },
      bench: {
        location: "/tiny",
        writable: false,
        defaultInputFormat: "parquet"
      }
    },
    formats: {
      parquet: {
        type: "parquet"
      },
      csv: {
        type: "text",
        extensions: ["csv"],
        delimiter: ","
      }
    },
    enabled: true
  }
}
