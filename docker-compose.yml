# Bring up one engine at a time with Docker Compose profiles, e.g.:
#   docker compose --profile trino up -d
#   docker compose --profile doris up -d
#   docker compose --profile drill up -d
#   docker compose --profile pinot up -d
#   docker compose --profile druid up -d
#
# `garage` carries every engine's profile so the shared dataset store
# always comes up alongside whichever engine you pick, without needing to run

networks:
  benchmark:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  garage-data:
  hive-metastore-db-data:
  druid-postgres-data:

services:
  # ---------------------------------------------------------------------
  # Shared dataset store (Garage, S3-compatible) - used by every engine.
  # ---------------------------------------------------------------------
  garage:
    build:
      context: infra/garage
    profiles: ["data", "trino", "doris", "drill", "pinot", "druid"]
    ports:
      - "9000:3900" # S3 API
    volumes:
      - garage-data:/var/lib/garage
    networks: [benchmark]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3903/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------
  # Trino - queries the shared Parquet dataset directly via Hive Metastore.
  # ---------------------------------------------------------------------
  hive-metastore-db:
    image: postgres:16
    profiles: ["trino"]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    networks: [benchmark]

  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    profiles: ["trino"]
    depends_on: [hive-metastore-db, garage]
    environment:
      METASTORE_DB_HOSTNAME: hive-metastore-db
    volumes:
      - ./engines/trino/hive-metastore/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
    ports:
      - "9083:9083"
    networks: [benchmark]
    mem_limit: 1g

  trino:
    build:
      context: engines/trino
    profiles: ["trino"]
    depends_on: [hive-metastore]
    restart: on-failure:5
    ports:
      - "8080:8080"
    networks: [benchmark]
    mem_limit: 4g

  # ---------------------------------------------------------------------
  # Drill - queries the shared Parquet dataset directly via the `dfs`
  # storage plugin (see engines/drill/conf). `drillbit.sh run` (server mode)
  # needs a real ZooKeeper for cluster coordination, unlike `drill-embedded`.
  # ---------------------------------------------------------------------
  drill-zookeeper:
    image: zookeeper:3.9
    profiles: ["drill"]
    networks: [benchmark]

  drill:
    build:
      context: engines/drill
    profiles: ["drill"]
    depends_on: [garage, drill-zookeeper]
    entrypoint: ["/opt/drill/bin/drillbit.sh", "run"]
    restart: on-failure:5
    ports:
      - "8047:8047"   # Web UI / REST API
      - "31010:31010" # JDBC
    networks: [benchmark]
    mem_limit: 4g

  # ---------------------------------------------------------------------
  # Apache Doris - FE (metadata/planning) + BE (storage/execution). 
  # Data is loaded into Doris via engines/doris/ddl/load_from_s3.sql.
  # Doris BE requires the *host's* vm.max_map_count >= 2000000
  # ---------------------------------------------------------------------
  doris-fe:
    build:
      context: engines/doris
      args:
        DORIS_ROLE: fe
    profiles: ["doris"]
    environment:
      FE_SERVERS: "fe1:172.28.100.10:9010"
      FE_ID: "1"
    networks:
      benchmark:
        ipv4_address: 172.28.100.10
    ports:
      - "8030:8030" # HTTP
      - "9030:9030" # MySQL protocol
    restart: on-failure:5
    mem_limit: 2g

  doris-be:
    build:
      context: engines/doris
      args:
        DORIS_ROLE: be
    profiles: ["doris"]
    depends_on: [doris-fe]
    environment:
      FE_SERVERS: "fe1:172.28.100.10:9010"
      BE_ADDR: "172.28.100.11:9050"
    networks:
      benchmark:
        ipv4_address: 172.28.100.11
    ports:
      - "8040:8040"
    restart: on-failure:5
    mem_limit: 4g

  # ---------------------------------------------------------------------
  # Apache Pinot - controller/broker/server. Data is loaded into Pinot's own
  # segment storage via scripts/setup_pinot.py + engines/pinot/ingestion/.
  # ---------------------------------------------------------------------
  pinot-zookeeper:
    image: zookeeper:3.9
    profiles: ["pinot"]
    networks: [benchmark]

  pinot-controller:
    build:
      context: engines/pinot
    profiles: ["pinot"]
    command: StartController -zkAddress pinot-zookeeper:2181
    depends_on: [pinot-zookeeper, garage]
    restart: on-failure:5
    ports:
      - "9002:9000" # remapped on the host - 9000 is already taken by garage
    networks: [benchmark]
    mem_limit: 1g

  pinot-broker:
    build:
      context: engines/pinot
    profiles: ["pinot"]
    command: StartBroker -zkAddress pinot-zookeeper:2181
    depends_on: [pinot-controller]
    restart: on-failure:5
    ports:
      - "8099:8099"
    networks: [benchmark]
    mem_limit: 1g

  pinot-server:
    build:
      context: engines/pinot
    profiles: ["pinot"]
    command: StartServer -zkAddress pinot-zookeeper:2181
    depends_on: [pinot-broker]
    restart: on-failure:5
    ports:
      - "8098:8098"
    networks: [benchmark]
    mem_limit: 2g

  # ---------------------------------------------------------------------
  # Apache Druid - full cluster (coordinator/overlord, broker, historical,
  # middleManager, router). 
  # Deep storage is Garage (S3-compatible); metadata store is Postgres.
  # Data is loaded via scripts/submit_druid_ingestion.py.
  # ---------------------------------------------------------------------
  druid-zookeeper:
    image: zookeeper:3.9
    profiles: ["druid"]
    networks: [benchmark]

  druid-postgres:
    image: postgres:16
    profiles: ["druid"]
    environment:
      POSTGRES_DB: druid
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
    volumes:
      - druid-postgres-data:/var/lib/postgresql/data
    networks: [benchmark]

  druid-coordinator:
    build:
      context: engines/druid
    profiles: ["druid"]
    command: ["coordinator"]
    env_file: engines/druid/environment
    depends_on: [druid-zookeeper, druid-postgres, garage]
    restart: on-failure:5
    ports:
      - "8081:8081"
    networks: [benchmark]
    mem_limit: 2g

  druid-broker:
    build:
      context: engines/druid
    profiles: ["druid"]
    command: ["broker"]
    env_file: engines/druid/environment
    depends_on: [druid-coordinator]
    restart: on-failure:5
    ports:
      - "8082:8082"
    networks: [benchmark]
    mem_limit: 2g

  druid-historical:
    build:
      context: engines/druid
    profiles: ["druid"]
    command: ["historical"]
    env_file: engines/druid/environment
    depends_on: [druid-coordinator]
    restart: on-failure:5
    ports:
      - "8083:8083"
    networks: [benchmark]
    mem_limit: 2g

  druid-middlemanager:
    build:
      context: engines/druid
    profiles: ["druid"]
    command: ["middleManager"]
    env_file: engines/druid/environment
    depends_on: [druid-coordinator]
    restart: on-failure:5
    ports:
      - "8091:8091"
    networks: [benchmark]
    mem_limit: 2g

  druid-router:
    build:
      context: engines/druid
    profiles: ["druid"]
    command: ["router"]
    env_file: engines/druid/environment
    depends_on: [druid-coordinator, druid-broker]
    restart: on-failure:5
    ports:
      - "8888:8888"
    networks: [benchmark]
    mem_limit: 1g
