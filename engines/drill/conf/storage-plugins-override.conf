// Overrides Drill's default `dfs` storage plugin to point at the MinIO bucket

drill.exec.storage.plugins: {
  dfs: {
    type: "file",
    connection: "s3a://benchmark-data",
    config: {
      "fs.s3a.endpoint": "minio:9000",
      "fs.s3a.access.key": "minioadmin",
      "fs.s3a.secret.key": "minioadmin",
      "fs.s3a.path.style.access": "true",
      "fs.s3a.connection.ssl.enabled": "false"
    },
    workspaces: {
      root: {
        location: "/",
        writable: false
      },
      bench: {
        location: "/tiny",
        writable: false,
        defaultInputFormat: "parquet"
      }
    },
    formats: {
      parquet: {
        type: "parquet"
      },
      csv: {
        type: "text",
        extensions: ["csv"],
        delimiter: ","
      }
    },
    enabled: true
  }
}
