connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# MinIO (S3-compatible) holds the shared Parquet dataset - see docker-compose.yml's
# `minio` service and .env.example for credentials.
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
hive.s3.aws-access-key=${ENV:MINIO_ROOT_USER}
hive.s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# The Parquet directories are written by datagen/generate.py directly, not by
# Trino, so external tables must be registered against them explicitly.
hive.non-managed-table-writes-enabled=true
