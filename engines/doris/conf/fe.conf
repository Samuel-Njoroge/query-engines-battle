CUR_DATE = `date +%Y%m%d-%H%M%S`

# Ports (Doris defaults)
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# Docker containers get a new IP on every recreate - bind by container name
# via the compose network's DNS instead of a fixed IP/CIDR.
priority_networks = 0.0.0.0/0

meta_dir = /opt/apache-doris/fe/doris-meta
sys_log_level = INFO
